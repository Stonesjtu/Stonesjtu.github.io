<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 750" width="2320" height="1500" role="img" aria-labelledby="title desc"><title id="title">AI Infra connects Model to Hardware</title><desc id="desc">A clean framework showing model computation, state, and execution mode mapped by AI infrastructure compilation, placement, caching, scheduling, and operations onto hardware compute, memory, topology, and power under a service objective.</desc><!-- svg-source:excalidraw --><metadata/><defs><style>
.title{font:30px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#1f2937}.subtitle{font:17px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#5d6b82}.heading{font:21px Virgil,"Segoe Print","Comic Sans MS",sans-serif}.subheading{font:15px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#5d6b82}.body{font:13px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#1f2937}.label{font:13px Virgil,"Segoe Print","Comic Sans MS",sans-serif}.feedback{font:14px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#5d6b82}.objective-title{font:17px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#e67700}.objective-body{font:16px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#1f2937}
</style></defs><rect width="1160" height="750" fill="#f8fafc"/><text x="34" y="51" class="title">AI Infra connects Model to Hardware</text><text x="36" y="88" class="subtitle">Implement model semantics on physical resources under a service objective.</text>
<g><rect x="40" y="130" width="275" height="410" rx="18" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><text x="66" y="179" class="heading" fill="#6741d9">MODEL</text><text x="66" y="204" class="subheading">What must run</text><g><rect x="66" y="225" width="223" height="72" rx="12" fill="#ffffff" stroke="#6741d9" stroke-width="2"/><path d="M 74 227 C 132.89999999999998 224, 222.1 227, 281 226" fill="none" stroke="#6741d9" stroke-width=".9" opacity=".3"/><text x="82" y="252" style="font:17px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#6741d9">Computation graph</text><text x="82" y="274" class="body"><tspan x="82" dy="0">operators + shapes</tspan><tspan x="82" dy="18">numeric precision</tspan></text></g><g><rect x="66" y="318" width="223" height="72" rx="12" fill="#ffffff" stroke="#6741d9" stroke-width="2"/><path d="M 74 320 C 132.89999999999998 317, 222.1 320, 281 319" fill="none" stroke="#6741d9" stroke-width=".9" opacity=".3"/><text x="82" y="345" style="font:17px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#6741d9">State</text><text x="82" y="367" class="body"><tspan x="82" dy="0">weights + activations</tspan><tspan x="82" dy="18">KV cache + context</tspan></text></g><g><rect x="66" y="411" width="223" height="72" rx="12" fill="#ffffff" stroke="#6741d9" stroke-width="2"/><path d="M 74 413 C 132.89999999999998 410, 222.1 413, 281 412" fill="none" stroke="#6741d9" stroke-width=".9" opacity=".3"/><text x="82" y="438" style="font:17px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#6741d9">Execution mode</text><text x="82" y="460" class="body"><tspan x="82" dy="0">train + serve</tspan><tspan x="82" dy="18">agent loop</tspan></text></g></g>
<g><rect x="365" y="110" width="430" height="450" rx="18" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/><text x="391" y="162" style="font:22px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#c92a2a">AI INFRA</text><text x="391" y="189" class="subheading">How the model maps to hardware</text><g><rect x="397" y="214" width="165" height="92" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><path d="M 405 216 C 446.5 213, 512.5 216, 554 215" fill="none" stroke="#c92a2a" stroke-width=".9" opacity=".3"/><text x="413" y="241" style="font:16px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#c92a2a">1. Compile</text><text x="413" y="263" class="body"><tspan x="413" dy="0">graphs + kernels</tspan><tspan x="413" dy="18">numeric formats</tspan></text></g><g><rect x="598" y="214" width="165" height="92" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><path d="M 606 216 C 647.5 213, 713.5 216, 755 215" fill="none" stroke="#c92a2a" stroke-width=".9" opacity=".3"/><text x="614" y="241" style="font:16px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#c92a2a">2. Partition + place</text><text x="614" y="263" class="body"><tspan x="614" dy="0">parallelism</tspan><tspan x="614" dy="18">devices + routing</tspan></text></g><g><rect x="397" y="332" width="165" height="92" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><path d="M 405 334 C 446.5 331, 512.5 334, 554 333" fill="none" stroke="#c92a2a" stroke-width=".9" opacity=".3"/><text x="413" y="359" style="font:16px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#c92a2a">3. Move + cache</text><text x="413" y="381" class="body"><tspan x="413" dy="0">batching + KV</tspan><tspan x="413" dy="18">communication</tspan></text></g><g><rect x="598" y="332" width="165" height="92" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><path d="M 606 334 C 647.5 331, 713.5 334, 755 333" fill="none" stroke="#c92a2a" stroke-width=".9" opacity=".3"/><text x="614" y="359" style="font:16px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#c92a2a">4. Schedule + operate</text><text x="614" y="381" class="body"><tspan x="614" dy="0">latency + isolation</tspan><tspan x="614" dy="18">recovery</tspan></text></g><rect x="397" y="462" width="366" height="62" rx="12" fill="#ffe3e3" stroke="#c92a2a"/><text x="580" y="499" text-anchor="middle" style="font:16px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#c92a2a">compiler + runtime + distributed system</text></g>
<g><rect x="845" y="130" width="275" height="410" rx="18" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text x="871" y="179" class="heading" fill="#2b8a3e">HARDWARE</text><text x="871" y="204" class="subheading">What can run</text><g><rect x="871" y="225" width="223" height="72" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/><path d="M 879 227 C 937.9 224, 1027.1 227, 1086 226" fill="none" stroke="#2b8a3e" stroke-width=".9" opacity=".3"/><text x="887" y="252" style="font:17px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#2b8a3e">Compute engines</text><text x="887" y="274" class="body"><tspan x="887" dy="0">CPU + GPU</tspan><tspan x="887" dy="18">TPU + NPU</tspan></text></g><g><rect x="871" y="318" width="223" height="72" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/><path d="M 879 320 C 937.9 317, 1027.1 320, 1086 319" fill="none" stroke="#2b8a3e" stroke-width=".9" opacity=".3"/><text x="887" y="345" style="font:17px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#2b8a3e">Memory hierarchy</text><text x="887" y="367" class="body"><tspan x="887" dy="0">SRAM + HBM</tspan><tspan x="887" dy="18">DRAM + storage</tspan></text></g><g><rect x="871" y="411" width="223" height="72" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/><path d="M 879 413 C 937.9 410, 1027.1 413, 1086 412" fill="none" stroke="#2b8a3e" stroke-width=".9" opacity=".3"/><text x="887" y="438" style="font:17px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#2b8a3e">Topology + power</text><text x="887" y="460" class="body"><tspan x="887" dy="0">PCIe + NVLink</tspan><tspan x="887" dy="18">network + edge</tspan></text></g></g>
<path d="M315 330 C332 328 348 331 365 330 M351 322 L365 330 L351 338" fill="none" stroke="#c92a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="310" text-anchor="middle" class="label" fill="#c92a2a">model contract</text>
<path d="M795 330 C812 328 828 331 845 330 M831 322 L845 330 L831 338" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="820" y="310" text-anchor="middle" class="label" fill="#2b8a3e">mapped execution</text>
<path d="M980 590 C760 594 420 586 180 590 M194 582 L180 590 L194 598" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="9 7" stroke-linecap="round"/><text x="580" y="580" text-anchor="middle" class="feedback">hardware constraints reshape model design</text>
<path d="M580 560 C578 585 582 615 580 640 M572 626 L580 640 L588 626" fill="none" stroke="#e67700" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g><rect x="190" y="640" width="780" height="76" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="218" y="682" class="objective-title">SERVICE OBJECTIVE</text><text x="680" y="681" text-anchor="middle" class="objective-body">quality + latency + throughput + cost + energy + reliability</text></g></svg>
