<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="930" viewBox="0 0 1160 930" role="img" aria-labelledby="title desc">
<title id="title">Overview: the MXFP4 kernel steps</title>
<desc id="desc">A vertical map names the five stages and keeps only the high-level representation changes.</desc>
<!-- svg-source:excalidraw -->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315a9f"/></marker>
  <style>
    .title{font:700 28px Inter,ui-sans-serif,system-ui,sans-serif;fill:#17212b}
    .subtitle{font:500 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#64748b}
    .label{font:700 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#17212b}
    .note{font:500 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#64748b}
    .mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}
    .bit{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}
    .tiny{font:600 10px Inter,ui-sans-serif,system-ui,sans-serif;fill:#64748b}
    .chipText{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1e293b}
  </style>
</defs>
<rect width="1160" height="930" rx="18" fill="#f8fbff"/>
<text x="44" y="58" class="title">Overview: the MXFP4 kernel steps</text>
<text x="46" y="84" class="subtitle">A vertical map names the five stages and keeps only the high-level representation changes.</text>
<rect x="44" y="112" width="1072" height="780" rx="12" fill="#ffffff" stroke="#7aa7df" stroke-width="2"/><text x="68" y="144" class="label" text-anchor="start">A vertical reading map for the MXFP4 part of matmul_ogs</text><text x="68" y="170" class="note" text-anchor="start">Only the high-level representation changes are shown here; detailed bit layouts live in the section diagrams below.</text><rect x="72" y="214" width="1016" height="112" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="96" cy="240" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="96" y="245" class="chipText" text-anchor="middle">1</text><text x="130" y="244" class="label" text-anchor="start">Packing</text><text x="130" y="274" class="note" text-anchor="start">Pack four FP4 values into one kernel word.</text><rect x="572" y="244" width="188" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="666" y="271" class="mono" text-anchor="middle">4 FP4</text><path d="M 784 266 L 840 266" fill="none" stroke="#315a9f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="864" y="244" width="204" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="966" y="271" class="mono" text-anchor="middle">uint16</text><path d="M 580 329 L 580 341" fill="none" stroke="#315a9f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="72" y="346" width="1016" height="112" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="96" cy="372" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="96" y="377" class="chipText" text-anchor="middle">2</text><text x="130" y="376" class="label" text-anchor="start">Unpacking</text><text x="130" y="406" class="note" text-anchor="start">Recover the four values and expand them into BF16-shaped lanes.</text><rect x="572" y="376" width="188" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="666" y="403" class="mono" text-anchor="middle">uint16</text><path d="M 784 398 L 840 398" fill="none" stroke="#315a9f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="864" y="376" width="204" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="966" y="403" class="mono" text-anchor="middle">4 FP4 + 4 BF16</text><path d="M 580 461 L 580 473" fill="none" stroke="#315a9f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="72" y="478" width="1016" height="112" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><circle cx="96" cy="504" r="14" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/><text x="96" y="509" class="chipText" text-anchor="middle">3a</text><text x="130" y="508" class="label" text-anchor="start">Exponent bias compensation</text><text x="130" y="538" class="note" text-anchor="start">Repair exponent bias after BF16-shaped placement.</text><rect x="572" y="508" width="188" height="44" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="666" y="535" class="mono" text-anchor="middle">BF16</text><path d="M 784 530 L 840 530" fill="none" stroke="#315a9f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="864" y="508" width="204" height="44" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="966" y="535" class="mono" text-anchor="middle">BF16</text><path d="M 580 593 L 580 605" fill="none" stroke="#315a9f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="72" y="610" width="1016" height="112" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="96" cy="636" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><text x="96" y="641" class="chipText" text-anchor="middle">3b</text><text x="130" y="640" class="label" text-anchor="start">Scale application</text><text x="130" y="670" class="note" text-anchor="start">Add the MXFP4 scale contribution into the BF16 exponent path.</text><rect x="572" y="640" width="188" height="44" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="666" y="667" class="mono" text-anchor="middle">BF16 W + scale</text><path d="M 784 662 L 840 662" fill="none" stroke="#315a9f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="864" y="640" width="204" height="44" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="966" y="667" class="mono" text-anchor="middle">scaled BF16 W</text><path d="M 580 725 L 580 737" fill="none" stroke="#315a9f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="72" y="742" width="1016" height="112" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><circle cx="96" cy="768" r="14" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/><text x="96" y="773" class="chipText" text-anchor="middle">4</text><text x="130" y="772" class="label" text-anchor="start">BF16 math consumption</text><text x="130" y="802" class="note" text-anchor="start">Consume the scaled weight with the activation.</text><rect x="572" y="772" width="188" height="44" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="666" y="799" class="mono" text-anchor="middle">scaled W + act</text><path d="M 784 794 L 840 794" fill="none" stroke="#315a9f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="864" y="772" width="204" height="44" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="966" y="799" class="mono" text-anchor="middle">BF16</text>
</svg>
