<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Canonical strong scaling and weak scaling</title>
  <desc id="desc">Two panels show strong scaling reducing completion time for fixed total work and weak scaling increasing total work with processor count while work per processor remains constant.</desc>
  <rect width="960" height="560" fill="#f7f8fb"/>
  <style>
    .title { font: 700 25px Inter, Arial, sans-serif; fill: #172033; }
    .subtitle { font: 400 14px Inter, Arial, sans-serif; fill: #5d6b82; }
    .panel-title { font: 700 19px Inter, Arial, sans-serif; }
    .label { font: 600 13px Inter, Arial, sans-serif; fill: #172033; }
    .small { font: 400 12px Inter, Arial, sans-serif; fill: #5d6b82; }
    .formula { font: 600 14px "SFMono-Regular", Consolas, monospace; fill: #172033; }
  </style>

  <text class="title" x="60" y="48">Strong scaling fixes work; weak scaling grows work with resources</text>
  <text class="subtitle" x="60" y="74">These are parallel-computing definitions. AI product growth is an economic analogy to the weak-scaling regime.</text>

  <g transform="translate(60 108)">
    <rect width="400" height="376" rx="7" fill="#ffffff" stroke="#cbd3df"/>
    <text class="panel-title" x="28" y="40" fill="#286aa6">Strong scaling</text>
    <text class="small" x="28" y="64">Fixed total workload W</text>

    <line x1="72" y1="294" x2="350" y2="294" stroke="#7b8799" stroke-width="1.5"/>
    <line x1="72" y1="104" x2="72" y2="294" stroke="#7b8799" stroke-width="1.5"/>
    <text class="small" x="212" y="326">processors P</text>
    <text class="small" transform="translate(30 238) rotate(-90)">completion time</text>

    <path d="M82 124 C130 172, 190 226, 342 260" fill="none" stroke="#3e7fca" stroke-width="4"/>
    <path d="M82 114 V276" stroke="#d8dee8" stroke-dasharray="4 5"/>
    <path d="M342 114 V276" stroke="#d8dee8" stroke-dasharray="4 5"/>
    <circle cx="82" cy="124" r="6" fill="#ffffff" stroke="#3e7fca" stroke-width="3"/>
    <circle cx="342" cy="260" r="6" fill="#ffffff" stroke="#3e7fca" stroke-width="3"/>

    <rect x="125" y="118" width="192" height="62" rx="5" fill="#edf5fc" stroke="#9dbbda"/>
    <text class="label" x="143" y="143">More processors finish</text>
    <text class="label" x="143" y="162">the same work sooner</text>
    <text class="formula" x="92" y="354">T ~= W / P + communication</text>
  </g>

  <g transform="translate(500 108)">
    <rect width="400" height="376" rx="7" fill="#ffffff" stroke="#cbd3df"/>
    <text class="panel-title" x="28" y="40" fill="#9b3f39">Weak scaling</text>
    <text class="small" x="28" y="64">Fixed work per processor W0</text>

    <line x1="72" y1="294" x2="350" y2="294" stroke="#7b8799" stroke-width="1.5"/>
    <line x1="72" y1="104" x2="72" y2="294" stroke="#7b8799" stroke-width="1.5"/>
    <text class="small" x="212" y="326">processors P</text>
    <text class="small" transform="translate(30 235) rotate(-90)">total workload</text>

    <path d="M82 267 L342 122" fill="none" stroke="#bd554e" stroke-width="4"/>
    <circle cx="82" cy="267" r="6" fill="#ffffff" stroke="#bd554e" stroke-width="3"/>
    <circle cx="342" cy="122" r="6" fill="#ffffff" stroke="#bd554e" stroke-width="3"/>
    <rect x="102" y="198" width="202" height="45" rx="5" fill="#eef8f0" stroke="#8db99a"/>
    <text class="label" x="122" y="225" fill="#34714b">work / processor stays at W0</text>

    <rect x="105" y="118" width="182" height="58" rx="5" fill="#faeeee" stroke="#d49a96"/>
    <text class="label" x="124" y="143">More processors carry</text>
    <text class="label" x="124" y="162">proportionally more work</text>
    <text class="formula" x="100" y="354">W(P) ~= P x W0</text>
  </g>

  <text class="small" x="60" y="526">AI analogy: available compute is repeatedly reinvested in larger models, longer context, more reasoning steps, and autonomous agent work.</text>
</svg>
