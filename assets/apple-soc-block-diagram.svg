<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-labelledby="title desc"><title id="title">Simplified Apple SoC block diagram</title><desc id="desc">Camera, network, sensors, and display connect through specialized interfaces to a shared on-chip interconnect linking the CPU, GPU, Apple Neural Engine, media engines, memory, and storage.</desc><!-- svg-source:excalidraw --><metadata>Editable source: apple-soc-block-diagram.excalidraw</metadata><defs><filter id="panel-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#6d7378" flood-opacity="0.16"/></filter><filter id="block-shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#5d6368" flood-opacity="0.25"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7377"/></marker></defs><rect width="1200" height="670" fill="#eef0f2"/><rect x="42" y="115" width="1116" height="430" rx="12" fill="#ffffff" stroke="#dfe3e6" stroke-width="2" filter="url(#panel-shadow)"/><text x="68" y="153.5" fill="#303438" font-family="Virgil, Segoe UI, sans-serif" font-size="20" text-anchor="start">APPLE SoC</text><rect x="70" y="35" width="150" height="58" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="145" y="70.75" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Camera</text><rect x="344" y="35" width="150" height="58" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="419" y="70.75" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Network</text><rect x="706" y="27" width="160" height="66" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="786" y="56" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="16" text-anchor="middle">Motion +</text><text x="786" y="76" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="16" text-anchor="middle">other sensors</text><rect x="980" y="35" width="150" height="58" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="1055" y="70.75" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Display</text><rect x="70" y="185" width="170" height="84" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="155" y="222.75" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">Image signal</text><text x="155" y="244" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">processor</text><rect x="280" y="185" width="150" height="84" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="355" y="234.875" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="21" text-anchor="middle">CPU</text><rect x="470" y="185" width="160" height="84" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="550" y="222.75" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">Network</text><text x="550" y="244" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">interface</text><rect x="670" y="185" width="160" height="84" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="750" y="222.75" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">Sensor</text><text x="750" y="244" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">interface</text><rect x="870" y="185" width="180" height="84" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="960" y="222.75" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">Display</text><text x="960" y="244" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">controller</text><rect x="92" y="317" width="1016" height="56" rx="12" fill="#f13b35" stroke="#f13b35" stroke-width="2" filter="url(#block-shadow)"/><text x="600" y="352.5" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="20" text-anchor="middle">Shared on-chip interconnect</text><rect x="70" y="421" width="180" height="86" rx="12" fill="#2bb34a" stroke="#2bb34a" stroke-width="2" filter="url(#block-shadow)"/><text x="160" y="459.5" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Apple Neural</text><text x="160" y="482" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Engine (ANE)</text><rect x="290" y="421" width="160" height="86" rx="12" fill="#2bb34a" stroke="#2bb34a" stroke-width="2" filter="url(#block-shadow)"/><text x="370" y="472.25" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="22" text-anchor="middle">GPU</text><rect x="490" y="421" width="170" height="86" rx="12" fill="#ffba24" stroke="#ffba24" stroke-width="2" filter="url(#block-shadow)"/><text x="575" y="459.75" fill="#202428" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">Memory</text><text x="575" y="481" fill="#202428" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">controller</text><rect x="700" y="421" width="190" height="86" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="795" y="460" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="16" text-anchor="middle">Media engines</text><text x="795" y="480" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="16" text-anchor="middle">(video encode/decode)</text><rect x="930" y="421" width="170" height="86" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="1015" y="459.75" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">Storage</text><text x="1015" y="481" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="17" text-anchor="middle">controller</text><rect x="450" y="577" width="250" height="64" rx="12" fill="#ffba24" stroke="#ffba24" stroke-width="2" filter="url(#block-shadow)"/><text x="575" y="615.75" fill="#202428" font-family="Virgil, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Unified memory</text><rect x="888" y="577" width="250" height="64" rx="12" fill="#717477" stroke="#717477" stroke-width="2" filter="url(#block-shadow)"/><text x="1013" y="615.75" fill="#ffffff" font-family="Virgil, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Persistent storage</text><path d="M 145 93 L 145 185" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 419 93 L 550 185" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 786 93 L 750 185" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 960 185 L 1055 93" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 155 269 L 155 317" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 355 269 L 355 317" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 550 269 L 550 317" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 750 269 L 750 317" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 960 269 L 960 317" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 160 421 L 160 373" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 370 421 L 370 373" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 575 421 L 575 373" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 795 421 L 795 373" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1015 421 L 1015 373" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 575 507 L 575 577" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1015 507 L 1015 577" fill="none" stroke="#6f7377" stroke-width="2" marker-end="url(#arrow)"/></svg>
