<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="2200" height="1400" role="img" aria-labelledby="title desc"><title id="title">One request waits; one goal keeps working</title><desc id="desc">Traditional applications return a result and wait for the next human decision. Agentic applications turn one delegated goal into several concurrent machine-paced model, tool, verification, and retry branches.</desc><!-- svg-source:excalidraw --><metadata/><defs><style>
.title{font:30px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#1f2937}.subtitle{font:17px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#5d6b82}.heading{font:19px Virgil,"Segoe Print","Comic Sans MS",sans-serif}.note{font:15px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#5d6b82}.node{font:18px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#1f2937}.small{font:14px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#5d6b82}.branch-label{font:13px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#6741d9}.branch-flow{font:13px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#1f2937}
</style></defs><rect width="1100" height="700" fill="#f8fafc"/><text x="38" y="51" class="title">One request waits; one goal keeps working</text><text x="40" y="88" class="subtitle">Human-paced request loop versus machine-paced work tree.</text>
<g><rect x="40" y="118" width="1020" height="205" rx="18" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><path d="M48 120 C346 117,754 120,1052 119" fill="none" stroke="#1971c2" stroke-width=".8" opacity=".3"/><text x="64" y="162" class="heading" fill="#1971c2">TRADITIONAL APPLICATION</text><text x="64" y="188" class="note">One human decision starts one bounded operation</text>
<ellipse cx="124" cy="248" rx="46" ry="30" fill="#fff" stroke="#1971c2" stroke-width="2"/><text x="124" y="254" text-anchor="middle" class="node" fill="#1971c2">USER</text>
<path d="M170 248 L212 248 M199 240 L212 248 L199 256" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round"/><rect x="212" y="213" width="170" height="70" rx="12" fill="#fff" stroke="#1971c2" stroke-width="2"/><path d="M220 215 C263 212,331 215,374 214" fill="none" stroke="#1971c2" stroke-width=".8" opacity=".3"/><text x="297" y="255" text-anchor="middle" class="node">REQUEST</text>
<path d="M382 248 L427 248 M414 240 L427 248 L414 256" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round"/><rect x="427" y="213" width="180" height="70" rx="12" fill="#fff" stroke="#1971c2" stroke-width="2"/><path d="M435 215 C481 212,553 215,599 214" fill="none" stroke="#1971c2" stroke-width=".8" opacity=".3"/><text x="517" y="255" text-anchor="middle" class="node">SERVICE RUN</text>
<path d="M607 248 L652 248 M639 240 L652 248 L639 256" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round"/><rect x="652" y="213" width="150" height="70" rx="12" fill="#fff" stroke="#1971c2" stroke-width="2"/><path d="M660 215 C697 212,757 215,794 214" fill="none" stroke="#1971c2" stroke-width=".8" opacity=".3"/><text x="727" y="255" text-anchor="middle" class="node">RESULT</text>
<path d="M802 248 L847 248 M834 240 L847 248 L834 256" fill="none" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/><rect x="847" y="205" width="175" height="86" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/><path d="M855 207 C899.5 204,969.5 207,1014 206" fill="none" stroke="#c92a2a" stroke-width=".8" opacity=".3"/><text x="934" y="235" text-anchor="middle" style="font:18px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#c92a2a">WAIT FOR</text><text x="934" y="259" text-anchor="middle" style="font:18px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#c92a2a">USER</text>
<path d="M934 292 C720 297 380 287 124 292 M138 284 L124 292 L138 300" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round"/><text x="530" y="310" text-anchor="middle" class="small">another operation waits for another decision</text></g>
<g><rect x="40" y="353" width="1020" height="315" rx="18" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/><path d="M48 355 C346 352,754 355,1052 354" fill="none" stroke="#c92a2a" stroke-width=".8" opacity=".3"/><text x="64" y="397" class="heading" fill="#c92a2a">AGENTIC APPLICATION</text><text x="64" y="423" class="note">One delegated goal starts machine-paced branches</text>
<ellipse cx="111" cy="523" rx="41" ry="29" fill="#fff" stroke="#c92a2a" stroke-width="2"/><text x="111" y="529" text-anchor="middle" class="node" fill="#c92a2a">USER</text><path d="M152 523 L190 523 M177 515 L190 523 L177 531" fill="none" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/>
<ellipse cx="238" cy="523" rx="48" ry="34" fill="#fff3bf" stroke="#c92a2a" stroke-width="2"/><text x="238" y="529" text-anchor="middle" class="node" fill="#c92a2a">GOAL</text><path d="M286 523 L326 523 M313 514 L326 523 L313 532" fill="none" stroke="#c92a2a" stroke-width="3" stroke-linecap="round"/>
<rect x="326" y="438" width="430" height="190" rx="14" fill="#fff" stroke="#c92a2a" stroke-width="2"/><path d="M334 440 C455 437,627 440,748 439" fill="none" stroke="#c92a2a" stroke-width=".8" opacity=".3"/><text x="348" y="480" class="heading" fill="#c92a2a">MACHINE-PACED AGENT RUNTIME</text><g><rect x="348" y="495" width="386" height="36" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><path d="M356 497 C463.8 494,618.2 497,726 496" fill="none" stroke="#6741d9" stroke-width=".8" opacity=".3"/><text x="360" y="518" class="branch-label">BRANCH 1</text><text x="444" y="518" class="branch-flow">model -&gt; tool -&gt; verify -&gt; retry</text></g><g><rect x="348" y="543" width="386" height="36" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><path d="M356 545 C463.8 542,618.2 545,726 544" fill="none" stroke="#6741d9" stroke-width=".8" opacity=".3"/><text x="360" y="566" class="branch-label">BRANCH 2</text><text x="444" y="566" class="branch-flow">model -&gt; tool -&gt; verify -&gt; retry</text></g><g><rect x="348" y="591" width="386" height="36" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><path d="M356 593 C463.8 590,618.2 593,726 592" fill="none" stroke="#6741d9" stroke-width=".8" opacity=".3"/><text x="360" y="614" class="branch-label">BRANCH N</text><text x="444" y="614" class="branch-flow">model -&gt; tool -&gt; verify -&gt; retry</text></g>
<path d="M756 523 L806 523 M792 514 L806 523 L792 532" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round"/><rect x="806" y="470" width="220" height="108" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><path d="M814 472 C872 469,960 472,1018 471" fill="none" stroke="#2b8a3e" stroke-width=".8" opacity=".3"/><text x="916" y="513" text-anchor="middle" style="font:18px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#2b8a3e">COMPLETED WORK</text><text x="916" y="543" text-anchor="middle" style="font:14px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#1f2937">after many model,</text><text x="916" y="562" text-anchor="middle" style="font:14px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#1f2937">tool, and test steps</text>
<text x="541" y="658" text-anchor="middle" style="font:15px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#c92a2a">The system continues until budget, policy, or a quality threshold stops it.</text></g></svg>
