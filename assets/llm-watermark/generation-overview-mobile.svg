<svg xmlns="http://www.w3.org/2000/svg" width="380" height="2440" viewBox="0 0 380 2440" role="img" aria-labelledby="title desc"><title id="title">LLM generation and generative watermarking</title><desc id="desc">Ordinary generation has a random seed generator without a watermarking key; keyed generation uses the key and preceding text. Detection combines text and key into a score and threshold decision.</desc><!-- svg-source:excalidraw --><metadata id="excalidraw-scene" data-encoding="base64-zlib"></metadata><defs><marker id="arrow-5c6977" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5c6977"/></marker><marker id="arrow-3576cc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3576cc"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="20.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" fill="#18314b">LLM text generation</text><rect x="65" y="85" width="250" height="65" rx="10" fill="#f5f7fa" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="105.15" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#18314b">Preceding text x<tspan baseline-shift="sub" font-size="75%">&lt;t</tspan></text><path d="M190,150 L190,180" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)"/><rect x="125" y="180" width="130" height="55" rx="10" fill="#ffe071" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="193.85" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" fill="#18314b">LLM</text><path d="M190,235 L190,265" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)"/><rect x="65" y="265" width="250" height="75" rx="10" fill="#f5f7fa" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="276.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="20" fill="#18314b">LLM distribution</text><text x="190.0" y="302.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="20" fill="#18314b">p<tspan baseline-shift="sub" font-size="75%">LM</tspan>(·|x<tspan baseline-shift="sub" font-size="75%">&lt;t</tspan>)</text><path d="M315,302 L350,302 L350,578 L315,578" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)"/><rect x="65" y="380" width="250" height="70" rx="10" fill="#e5efff" stroke="#3576cc" stroke-width="1.5"/><text x="190.0" y="403.3" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" fill="#3576cc">Random seed generator</text><path d="M190,450 L190,545" fill="none" stroke="#3576cc" stroke-width="2" marker-end="url(#arrow-3576cc)"/><text x="200" y="468.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" fill="#3576cc">r<tspan baseline-shift="sub" font-size="75%">t</tspan></text><rect x="65" y="545" width="250" height="65" rx="10" fill="#e5efff" stroke="#3576cc" stroke-width="1.5"/><text x="190.0" y="565.15" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#3576cc">Sampling algorithm</text><path d="M190,610 L190,645" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)"/><rect x="65" y="645" width="250" height="60" rx="10" fill="#f5f7fa" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="662.65" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#18314b">Output token x<tspan baseline-shift="sub" font-size="75%">t</tspan></text><path d="M65,675 L12,675 L12,117 L65,117" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)" stroke-dasharray="7 6"/><text x="25" y="725.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="17" fill="#5c6977">Append output to preceding text</text><text x="190.0" y="354.0" dominant-baseline="text-before-edge" text-anchor="middle" font-size="17" fill="#5c6977">No watermarking key</text><text x="20" y="780.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" fill="#18314b">Generative watermarking</text><rect x="65" y="840" width="250" height="65" rx="10" fill="#f5f7fa" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="860.15" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#18314b">Preceding text x<tspan baseline-shift="sub" font-size="75%">&lt;t</tspan></text><path d="M190,905 L190,935" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)"/><rect x="125" y="935" width="130" height="55" rx="10" fill="#ffe071" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="948.85" dominant-baseline="text-before-edge" text-anchor="middle" font-size="21" fill="#18314b">LLM</text><path d="M190,990 L190,1020" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)"/><rect x="65" y="1020" width="250" height="75" rx="10" fill="#f5f7fa" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="1031.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="20" fill="#18314b">LLM distribution</text><text x="190.0" y="1057.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="20" fill="#18314b">p<tspan baseline-shift="sub" font-size="75%">LM</tspan>(·|x<tspan baseline-shift="sub" font-size="75%">&lt;t</tspan>)</text><path d="M315,1057 L350,1057 L350,1463 L315,1463" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)"/><rect x="65" y="1155" width="250" height="55" rx="10" fill="#f5f7fa" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="1170.15" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#18314b">Watermarking key</text><path d="M190,1210 L190,1260" fill="none" stroke="#3576cc" stroke-width="2" marker-end="url(#arrow-3576cc)"/><path d="M65,872 L30,872 L30,1295 L65,1295" fill="none" stroke="#3576cc" stroke-width="2" marker-end="url(#arrow-3576cc)"/><rect x="65" y="1260" width="250" height="70" rx="10" fill="#e5efff" stroke="#3576cc" stroke-width="1.5"/><text x="190.0" y="1283.3" dominant-baseline="text-before-edge" text-anchor="middle" font-size="18" fill="#3576cc">Random seed generator</text><path d="M190,1330 L190,1430" fill="none" stroke="#3576cc" stroke-width="2" marker-end="url(#arrow-3576cc)"/><text x="200" y="1348.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="20" fill="#3576cc">r<tspan baseline-shift="sub" font-size="75%">t</tspan></text><rect x="65" y="1430" width="250" height="65" rx="10" fill="#e5efff" stroke="#3576cc" stroke-width="1.5"/><text x="190.0" y="1450.15" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#3576cc">Sampling algorithm</text><path d="M190,1495 L190,1530" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)"/><rect x="65" y="1530" width="250" height="60" rx="10" fill="#f5f7fa" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="1547.65" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#18314b">Output token x<tspan baseline-shift="sub" font-size="75%">t</tspan></text><path d="M65,1560 L12,1560 L12,872 L65,872" fill="none" stroke="#5c6977" stroke-width="2" marker-end="url(#arrow-5c6977)" stroke-dasharray="7 6"/><text x="25" y="1610.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="17" fill="#5c6977">Append output to preceding text</text><text x="20" y="1695.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="23" fill="#18314b">Watermark detection</text><rect x="65" y="1760" width="250" height="65" rx="10" fill="#f5f7fa" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="1779.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="20" fill="#18314b">Text x<tspan baseline-shift="sub" font-size="75%">1</tspan>, …, x<tspan baseline-shift="sub" font-size="75%">T</tspan></text><rect x="65" y="1860" width="250" height="55" rx="10" fill="#f5f7fa" stroke="#18314b" stroke-width="1.5"/><text x="190.0" y="1875.15" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#18314b">Watermarking key</text><path d="M315,1792 L350,1792 L350,1992 L315,1992" fill="none" stroke="#3576cc" stroke-width="2" marker-end="url(#arrow-3576cc)"/><path d="M190,1915 L190,1955" fill="none" stroke="#3576cc" stroke-width="2" marker-end="url(#arrow-3576cc)"/><rect x="65" y="1955" width="250" height="75" rx="10" fill="#e5efff" stroke="#3576cc" stroke-width="1.5"/><text x="190.0" y="1979.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="20" fill="#3576cc">Scoring function</text><path d="M190,2030 L190,2090" fill="none" stroke="#3576cc" stroke-width="2" marker-end="url(#arrow-3576cc)"/><text x="205" y="2047.0" dominant-baseline="text-before-edge" text-anchor="start" font-size="19" fill="#3576cc">Score(x)</text><rect x="65" y="2090" width="250" height="65" rx="10" fill="#e5efff" stroke="#3576cc" stroke-width="1.5"/><text x="190.0" y="2109.5" dominant-baseline="text-before-edge" text-anchor="middle" font-size="20" fill="#3576cc">Apply threshold</text><path d="M190,2155 L190,2210" fill="none" stroke="#3576cc" stroke-width="2" marker-end="url(#arrow-3576cc)"/><rect x="65" y="2210" width="250" height="100" rx="10" fill="#e5efff" stroke="#3576cc" stroke-width="1.5"/><text x="190.0" y="2222.95" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#3576cc">Decision:</text><text x="190.0" y="2247.6499999999996" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#3576cc">Watermarked /</text><text x="190.0" y="2272.35" dominant-baseline="text-before-edge" text-anchor="middle" font-size="19" fill="#3576cc">not watermarked</text></g></svg>