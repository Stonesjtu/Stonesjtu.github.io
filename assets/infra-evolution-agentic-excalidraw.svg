<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="2400" height="1520" role="img" aria-labelledby="title desc"><title id="title">AI infrastructure evolution across models and hardware</title><desc id="desc">A four-era Excalidraw-style timeline with model, infrastructure, and hardware lanes. Compact machine learning on CPUs evolves into deep neural networks on GPUs and TPUs, transformers on HBM accelerator clusters, and multimodal agents on heterogeneous systems.</desc><!-- svg-source:excalidraw --><metadata/><defs><style>
svg{background:#f8fafc}.hand{font-family:Virgil,"Segoe Print","Comic Sans MS",sans-serif}.title{font:30px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#1f2937}.subtitle,.year{font:17px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#5d6b82}.lane{font:700 18px Virgil,"Segoe Print","Comic Sans MS",sans-serif;letter-spacing:.04em}.box-title{font:19px Virgil,"Segoe Print","Comic Sans MS",sans-serif}.box-body{font:15px Virgil,"Segoe Print","Comic Sans MS",sans-serif}.map{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}.model-map{stroke:#c92a2a}.hardware-map{stroke:#2b8a3e}.footer{font:17px Virgil,"Segoe Print","Comic Sans MS",sans-serif;fill:#c92a2a}
</style></defs><rect width="1200" height="760" fill="#f8fafc"/><text x="32" y="51" class="title">AI infrastructure maps evolving models onto evolving hardware</text><text x="34" y="88" class="subtitle">Read each era vertically: model execution -&gt; infrastructure mapping -&gt; hardware substrate.</text><path d="M160 122 C430 119 810 125 1120 122 M1107 114 L1121 122 L1107 130" fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="220" class="lane" fill="#6741d9">MODEL</text><text x="24" y="410" class="lane" fill="#c92a2a">INFRA</text><text x="24" y="603" class="lane" fill="#2b8a3e">HARDWARE</text><text x="260" y="119" text-anchor="middle" class="year">2000s-2011</text><g class="box"><rect x="150" y="155" width="220" height="130" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><path d="M 159 158 C 227 154, 304 157, 360 156" fill="none" stroke="#6741d9" stroke-width="1.2" opacity=".32"/><text x="168" y="186" class="box-title" fill="#6741d9">Compact ML</text><text x="168" y="225" class="box-body" fill="#1f2937"><tspan x="168" dy="0">features</tspan><tspan x="168" dy="23">trees, rankers</tspan></text></g><path d="M 260 288 C 258 300, 261 312, 260 322 M 253 313 L 260 323 L 267 313" class="map model-map"/><g class="box"><rect x="150" y="330" width="220" height="155" rx="14" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/><path d="M 159 333 C 227 329, 304 332, 360 331" fill="none" stroke="#c92a2a" stroke-width="1.2" opacity=".32"/><text x="168" y="361" class="box-title" fill="#c92a2a">Data + serving</text><text x="168" y="400" class="box-body" fill="#1f2937"><tspan x="168" dy="0">ETL</tspan><tspan x="168" dy="23">features, CPU scheduling</tspan></text></g><path d="M 260 488 C 258 502, 261 516, 260 527 M 253 518 L 260 528 L 267 518" class="map hardware-map"/><g class="box"><rect x="150" y="535" width="220" height="130" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><path d="M 159 538 C 227 534, 304 537, 360 536" fill="none" stroke="#2b8a3e" stroke-width="1.2" opacity=".32"/><text x="168" y="566" class="box-title" fill="#2b8a3e">CPU + DRAM</text><text x="168" y="605" class="box-body" fill="#1f2937"><tspan x="168" dy="0">servers + Ethernet</tspan></text></g><text x="515" y="119" text-anchor="middle" class="year">2012-2017</text><g class="box"><rect x="405" y="155" width="220" height="130" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><path d="M 414 158 C 482 154, 559 157, 615 156" fill="none" stroke="#6741d9" stroke-width="1.2" opacity=".32"/><text x="423" y="186" class="box-title" fill="#6741d9">CNNs + RNNs</text><text x="423" y="225" class="box-body" fill="#1f2937"><tspan x="423" dy="0">dense training</tspan><tspan x="423" dy="23">fixed tasks</tspan></text></g><path d="M 515 288 C 513 300, 516 312, 515 322 M 508 313 L 515 323 L 522 313" class="map model-map"/><g class="box"><rect x="405" y="330" width="220" height="155" rx="14" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/><path d="M 414 333 C 482 329, 559 332, 615 331" fill="none" stroke="#c92a2a" stroke-width="1.2" opacity=".32"/><text x="423" y="361" class="box-title" fill="#c92a2a">Accelerated ML</text><text x="423" y="400" class="box-body" fill="#1f2937"><tspan x="423" dy="0">GPU kernels</tspan><tspan x="423" dy="23">distributed SGD</tspan></text></g><path d="M 515 488 C 513 502, 516 516, 515 527 M 508 518 L 515 528 L 522 518" class="map hardware-map"/><g class="box"><rect x="405" y="535" width="220" height="130" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><path d="M 414 538 C 482 534, 559 537, 615 536" fill="none" stroke="#2b8a3e" stroke-width="1.2" opacity=".32"/><text x="423" y="566" class="box-title" fill="#2b8a3e">GPU + first TPU</text><text x="423" y="605" class="box-body" fill="#1f2937"><tspan x="423" dy="0">device memory +</tspan><tspan x="423" dy="23">PCIe</tspan></text></g><text x="770" y="119" text-anchor="middle" class="year">2018-2022</text><g class="box"><rect x="660" y="155" width="220" height="130" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><path d="M 669 158 C 737 154, 814 157, 870 156" fill="none" stroke="#6741d9" stroke-width="1.2" opacity=".32"/><text x="678" y="186" class="box-title" fill="#6741d9">Transformers + LLMs</text><text x="678" y="225" class="box-body" fill="#1f2937"><tspan x="678" dy="0">tokens</tspan><tspan x="678" dy="23">context, generation</tspan></text></g><path d="M 770 288 C 768 300, 771 312, 770 322 M 763 313 L 770 323 L 777 313" class="map model-map"/><g class="box"><rect x="660" y="330" width="220" height="155" rx="14" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/><path d="M 669 333 C 737 329, 814 332, 870 331" fill="none" stroke="#c92a2a" stroke-width="1.2" opacity=".32"/><text x="678" y="361" class="box-title" fill="#c92a2a">LLM systems</text><text x="678" y="400" class="box-body" fill="#1f2937"><tspan x="678" dy="0">parallelism</tspan><tspan x="678" dy="23">fused kernels, KV cache</tspan></text></g><path d="M 770 488 C 768 502, 771 516, 770 527 M 763 518 L 770 528 L 777 518" class="map hardware-map"/><g class="box"><rect x="660" y="535" width="220" height="130" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><path d="M 669 538 C 737 534, 814 537, 870 536" fill="none" stroke="#2b8a3e" stroke-width="1.2" opacity=".32"/><text x="678" y="566" class="box-title" fill="#2b8a3e">Tensor GPU / TPU</text><text x="678" y="605" class="box-body" fill="#1f2937"><tspan x="678" dy="0">HBM +</tspan><tspan x="678" dy="23">high-speed fabrics</tspan></text></g><text x="1025" y="119" text-anchor="middle" class="year">2023-now</text><g class="box"><rect x="915" y="155" width="220" height="130" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><path d="M 924 158 C 992 154, 1069 157, 1125 156" fill="none" stroke="#6741d9" stroke-width="1.2" opacity=".32"/><text x="933" y="186" class="box-title" fill="#6741d9">Multimodal + agents</text><text x="933" y="225" class="box-body" fill="#1f2937"><tspan x="933" dy="0">reason</tspan><tspan x="933" dy="23">act, observe, repeat</tspan></text></g><path d="M 1025 288 C 1023 300, 1026 312, 1025 322 M 1018 313 L 1025 323 L 1032 313" class="map model-map"/><g class="box"><rect x="915" y="330" width="220" height="155" rx="14" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/><path d="M 924 333 C 992 329, 1069 332, 1125 331" fill="none" stroke="#c92a2a" stroke-width="1.2" opacity=".32"/><text x="933" y="361" class="box-title" fill="#c92a2a">Agentic runtime</text><text x="933" y="400" class="box-body" fill="#1f2937"><tspan x="933" dy="0">routing</tspan><tspan x="933" dy="23">tools, state, retries</tspan></text></g><path d="M 1025 488 C 1023 502, 1026 516, 1025 527 M 1018 518 L 1025 528 L 1032 518" class="map hardware-map"/><g class="box"><rect x="915" y="535" width="220" height="130" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><path d="M 924 538 C 992 534, 1069 537, 1125 536" fill="none" stroke="#2b8a3e" stroke-width="1.2" opacity=".32"/><text x="933" y="566" class="box-title" fill="#2b8a3e">Heterogeneous compute</text><text x="933" y="605" class="box-body" fill="#1f2937"><tspan x="933" dy="0">HBM</tspan><tspan x="933" dy="23">SRAM, fabric, storage</tspan></text></g><g class="product-chip"><rect x="166" y="126" width="188" height="24" rx="8" fill="#fff3bf" stroke="#e67700" stroke-width="1.4"/><path d="M 174 129 C 228 125, 296 128, 346 127" fill="none" stroke="#e67700" stroke-width=".8" opacity=".3"/><text x="260" y="144" text-anchor="middle" style="font:13px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#9c4f00">Google Translate</text></g><g class="product-chip"><rect x="421" y="126" width="188" height="24" rx="8" fill="#fff3bf" stroke="#e67700" stroke-width="1.4"/><path d="M 429 129 C 483 125, 551 128, 601 127" fill="none" stroke="#e67700" stroke-width=".8" opacity=".3"/><text x="515" y="144" text-anchor="middle" style="font:13px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#9c4f00">Photos + neural Translate</text></g><g class="product-chip"><rect x="676" y="126" width="188" height="24" rx="8" fill="#fff3bf" stroke="#e67700" stroke-width="1.4"/><path d="M 684 129 C 738 125, 806 128, 856 127" fill="none" stroke="#e67700" stroke-width=".8" opacity=".3"/><text x="770" y="144" text-anchor="middle" style="font:13px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#9c4f00">GPT-3 API + ChatGPT</text></g><g class="product-chip"><rect x="931" y="126" width="188" height="24" rx="8" fill="#fff3bf" stroke="#e67700" stroke-width="1.4"/><path d="M 939 129 C 993 125, 1061 128, 1111 127" fill="none" stroke="#e67700" stroke-width=".8" opacity=".3"/><text x="1025" y="144" text-anchor="middle" style="font:13px Virgil,'Segoe Print','Comic Sans MS',sans-serif;fill:#9c4f00">OpenAI Codex</text></g><text x="600" y="724" text-anchor="middle" class="footer">The middle layer grows as model state and hardware topology become less interchangeable.</text></svg>
