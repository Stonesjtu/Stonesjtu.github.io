---
layout: default
---

<main class="post-page">
  <article class="post-shell">
    <header class="post-hero">
      <a class="back-link" href="{{ '/#writing' | relative_url }}">Back to writing</a>
      <p class="eyebrow">{{ page.topic }}</p>
      <h1>{{ page.title }}</h1>
      <p class="post-excerpt">{{ page.excerpt | strip_html }}</p>
    </header>

    <aside class="post-outline" aria-label="Article outline" hidden>
      <details class="outline-disclosure">
        <summary>On this page</summary>
        <nav aria-label="On this page"><ol class="outline-list"></ol></nav>
      </details>
    </aside>

    <div class="post-content">
      {{ content }}
    </div>

    {% include comments.html %}
  </article>
</main>
<script src="{{ '/assets/post-outline.js' | relative_url }}?v=20260910" defer></script>
